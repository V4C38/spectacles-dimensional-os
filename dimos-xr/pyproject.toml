[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dimos-xr"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["dimos", "websockets>=12.0"]

[project.optional-dependencies]
unitree = ["dimos[base,unitree]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[tool.setuptools.packages.find]
include = ["dimos_xr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: live WebSocket check against a running XR bridge",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
packages = ["dimos_xr"]

# DimOS, cv2, dimos_lcm, unitree_webrtc_connect, websockets ship without
# py.typed markers or stubs; they are genuinely untyped dependencies.
[[tool.mypy.overrides]]
module = [
    "dimos.*",
    "dimos_lcm.*",
    "cv2.*",
    "unitree_webrtc_connect.*",
    "websockets.*",
]
ignore_missing_imports = true

# @rpc from DimOS is untyped, causing [untyped-decorator] on every @rpc method.
# This is a DimOS upstream issue; suppress it in all files that use @rpc.
[[tool.mypy.overrides]]
module = [
    "dimos_xr.adapters.go2",
    "dimos_xr.adapters.g1",
    "dimos_xr.xr_bridge_module",
    "dimos_xr.preview_planner",
]
disallow_untyped_decorators = false
