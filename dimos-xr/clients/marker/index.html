<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DimOS AR calibration marker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #fff;
      overflow: hidden;
    }
    main {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Size is injected by marker_server.py from the shared marker contract. */
    #marker {
      width: __MARKER_WIDTH_MM__mm;
      height: __MARKER_HEIGHT_MM__mm;
      display: block;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main>
    <img
      id="marker"
      src="/apriltag_marker.png"
      alt="Composite calibration marker with AprilTag __MARKER_DICTIONARY__ id __MARKER_ID__"
    />
  </main>
</body>
</html>
