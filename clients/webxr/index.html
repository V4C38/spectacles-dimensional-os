<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#182028" />
    <title>dimOS AR</title>
    <link rel="stylesheet" href="/src/presentation/LandingPage.css" />
  </head>
  <body>
    <div id="overlay">
      <div class="landing-layout">
      <section class="landing-panel" aria-label="dimOS AR setup">
      <header>dimOS AR</header>
      <main>
        <label for="hmd">Headset</label>
        <select id="hmd" disabled></select>
        <button id="enter" type="button" disabled>Connect</button>
        <p id="status" role="status" aria-live="polite">Starting…</p>
      </main>
      </section>
      <aside class="landing-panel connection-panel" aria-label="Robot and available features">
        <h2 data-info="robot">Robot</h2>
        <p class="robot-status" role="status"><span class="robot-status-dot" aria-hidden="true"></span><span data-info="status">Connecting…</span></p>
        <p class="feature-heading">Available features</p>
        <ul class="feature-list" aria-label="Available features">
          <li data-feature="manipulation" hidden><span class="feature-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21h16M7 21v-5l5-5-4-5 3-3 7 8-5 6v4M16 4l4-1 1 4" /></svg></span><span>Manipulation</span></li>
          <li data-feature="object_detection" hidden><span class="feature-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 8h8v8H8Z" /></svg></span><span>Object detection</span></li>
          <li data-feature="navigation" hidden><span class="feature-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 21l8-5 8 5-8-18Z" /></svg></span><span>Navigation</span></li>
          <li data-feature="agent" hidden><span class="feature-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8h10a3 3 0 0 1 3 3v6H4v-6a3 3 0 0 1 3-3Zm5 0V4m-4 8h.01M16 12h.01M8 21v-4m8 4v-4" /></svg></span><span>Agent</span></li>
          <li data-feature="lidar" hidden><span class="feature-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V4m-6 2a9 9 0 0 0 0 12m12-12a9 9 0 0 1 0 12M9 9a4 4 0 0 0 0 6m6-6a4 4 0 0 1 0 6" /></svg></span><span>LiDAR</span></li>
          <li data-feature="localization" hidden><span class="feature-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6M8 12h8m-4-4v8" /></svg></span><span>Localization</span></li>
          <li data-feature="estop" hidden><span class="feature-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l5 5v8l-5 5H8l-5-5V8l5-5Zm1 6h6v6H9V9Z" /></svg></span><span>Emergency Stop</span></li>
        </ul>
        <p class="feature-empty" data-info="features">Waiting for robot…</p>
      </aside>
      <footer class="connection-footnote" aria-label="Version and connection details">
        <p><span>Server <span data-info="server">Unavailable</span></span><span data-detail="robot-ip" hidden>Robot <span data-info="robot-ip">Unavailable</span></span></p>
        <p><span data-detail="build">WebXR <span data-info="build">Unavailable</span></span><span data-detail="dimos" hidden>dimOS <span data-info="dimos">Unavailable</span></span><span data-detail="armodule" hidden>ARModule <span data-info="armodule">Unavailable</span></span></p>
      </footer>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
