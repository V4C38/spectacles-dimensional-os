name: CI

on:
  push:
  pull_request:

jobs:
  dimos-xr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dimos-xr

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dev tools and package (no DimOS)
        run: |
          python -m pip install --upgrade pip
          pip install websockets pytest pytest-asyncio ruff mypy numpy opencv-python-headless
          pip install -e . --no-deps

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy dimos_xr

      - name: Pytest (unit tests without DimOS)
        run: pytest -m "not integration"
