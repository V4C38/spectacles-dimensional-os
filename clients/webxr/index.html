<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>DimOS ARModule</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #fff; color: #111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #overlay { position: absolute; inset: 0; z-index: 2; min-height: 100svh; background: #fff; }
      header { padding: 22px 30px; border-bottom: 1px solid #e5e5e5; font-size: 17px; font-weight: 600; }
      main { width: min(360px, calc(100% - 40px)); margin: 15vh auto 0; }
      label { display: block; margin-bottom: 8px; font-size: 14px; }
      select, button { width: 100%; min-height: 48px; padding: 11px 14px; border: 1px solid #222; border-radius: 4px; background: #fff; color: #111; font: inherit; font-size: 15px; }
      select { margin-bottom: 12px; }
      select:focus-visible, button:focus-visible { outline: 3px solid #c8ff43; outline-offset: 2px; }
      button { border-color: #111; background: #111; color: #fff; cursor: pointer; font-weight: 600; }
      button:disabled { opacity: .45; cursor: default; }
      #status { min-height: 22px; margin: 12px 0 0; color: #444; font-size: 13px; line-height: 1.5; }
      #status:empty { display: none; }
      @media (max-width: 520px) { header { padding: 18px 20px; } main { margin-top: 12vh; } }
    </style>
  </head>
  <body>
    <div id="overlay">
      <header>DimOS ARModule</header>
      <main>
        <label for="hmd">HMD model</label>
        <select id="hmd" disabled></select>
        <button id="enter" type="button" disabled>Connect</button>
        <p id="status" role="status" aria-live="polite">Starting…</p>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
