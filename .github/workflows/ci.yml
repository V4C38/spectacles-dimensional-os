name: CI

on:
  push:
  pull_request:

jobs:
  dimos-ar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dimos-ar

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dev tools and package
        run: |
          python -m pip install --upgrade pip
          pip install websockets pytest pytest-asyncio ruff mypy numpy opencv-python-headless Pillow scipy dimos "aiohttp>=3.9,<4" "requests>=2.32,<3" langchain-core
          pip install -e . --no-deps

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy dimos/ar

      - name: Pytest (unit tests without robot hardware)
        run: pytest

      - name: WebXR offline camera calibration regression
        run: python -m pytest ../clients/webxr/tools/test_calibrate.py

  launcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher/app
    steps:
      - uses: actions/checkout@v6

      - name: Fetch AprilTag print assets
        working-directory: .
        run: git lfs pull --include="assets/markers/**" --exclude=""

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install launcher deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  client-specs-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/specs/Tests
    steps:
      - uses: actions/checkout@v6
      - name: Fetch native shader graphs for codec tests
        working-directory: .
        run: git lfs pull --include="clients/specs/Assets/Materials/Shaders/*.ss_graph" --exclude=""
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - name: Native review tooling unit tests
        working-directory: .
        run: python3 -m unittest discover -s clients/specs/Tests/integration-tests -p 'test_*.py'

  client-webxr-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/webxr
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install review video encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify integration contract and continuous encoding
        run: node --test ../../tools/integration-tests/integration.test.mjs ../../tools/visual-review.test.mjs
      - run: npm run test:integration
      - name: Upload browser visual reviews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webxr-visual-review
          path: clients/webxr/tests/integration-tests/test-results/
          retention-days: 14
          if-no-files-found: warn
