name: CI

on:
  push:
  pull_request:

jobs:
  dimos-ar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dimos-ar

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dev tools and package
        run: |
          python -m pip install --upgrade pip
          pip install websockets pytest pytest-asyncio ruff mypy numpy opencv-python-headless Pillow scipy dimos
          pip install -e . --no-deps

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy dimos/ar

      - name: Pytest (unit tests without robot hardware)
        run: pytest -m "not integration"

  launcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher/app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install launcher deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  lens-studio-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lens-studio/Tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
