name: CI

on:
  push:
  pull_request:

jobs:
  dimos-ar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run shared CI job
        run: ./launcher/scripts/run-ci.sh backend
      - name: Upload mock diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-manipulation-reports
          path: Review Data/mock-manipulation/
          retention-days: 14
      - name: Upload Python test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: |
            Review Data/unit/backend/
            Review Data/unit/calibration/
          retention-days: 14
          if-no-files-found: warn

  launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run shared CI job
        run: ./launcher/scripts/run-ci.sh launcher
      - name: Upload launcher test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-test-reports
          path: Review Data/unit/launcher/
          retention-days: 14
          if-no-files-found: warn

  client-core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run shared CI job
        run: ./launcher/scripts/run-ci.sh core
      - name: Upload Core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: Review Data/unit/core/
          retention-days: 14
          if-no-files-found: warn

  client-specs-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run shared CI job
        run: ./launcher/scripts/run-ci.sh specs
      - name: Upload Specs test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specs-test-reports
          path: |
            Review Data/unit/specs/
            Review Data/unit/specs-tooling/
            Review Data/coverage/specs/
          retention-days: 14
          if-no-files-found: warn

  client-webxr-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run shared CI job
        run: ./launcher/scripts/run-ci.sh webxr
      - name: Upload browser visual reviews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webxr-visual-review
          path: |
            Review Data/webxr_golden-path.mp4
            Review Data/webxr/
            Review Data/unit/webxr/
            Review Data/unit/integration-tooling/
            Review Data/coverage/webxr/
          retention-days: 14
          if-no-files-found: warn
