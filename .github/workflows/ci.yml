name: CI

on:
  push:
  pull_request:

jobs:
  dimos-ar:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dimos-ar

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dev tools and package
        run: |
          python -m pip install --upgrade pip
          GIT_LFS_SKIP_SMUDGE=1 pip install --src "${RUNNER_TEMP}/dimos-source" -r requirements-ci.txt -e "dimos @ git+https://github.com/dimensionalOS/dimos.git@$(cat ../.dimos-revision)" -e ".[dev]"

      - name: Ruff
        run: ruff check dimos/ar tools

      - name: Mypy
        run: mypy dimos/ar

      - name: Pytest (unit tests without robot hardware)
        run: pytest --junitxml="../Review Data/unit/backend/junit.xml"

      - name: WebXR offline camera calibration regression
        run: python -m pytest ../clients/webxr/tools/test_calibrate.py --junitxml="../Review Data/unit/calibration/junit.xml"

      - name: Install isolated manipulation runtime
        run: |
          ../launcher/scripts/install-ci-system-deps.sh planning
          python -m venv "${RUNNER_TEMP}/planning-venv"
          "${RUNNER_TEMP}/planning-venv/bin/python" -m pip install --upgrade pip
          GIT_LFS_SKIP_SMUDGE=1 "${RUNNER_TEMP}/planning-venv/bin/python" -m pip install --src "${RUNNER_TEMP}/planning-source" -e "dimos[planning] @ git+https://github.com/dimensionalOS/dimos.git@$(cat ../.dimos-revision)" -e ".[manipulation,dev]"
      - name: Verify official mock manipulation contract
        run: '"${RUNNER_TEMP}/planning-venv/bin/python" tools/run_mock_manipulation_contract.py'
      - name: Upload mock diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-manipulation-reports
          path: Review Data/mock-manipulation/
          retention-days: 14
      - name: Upload Python test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: |
            Review Data/unit/backend/
            Review Data/unit/calibration/
          retention-days: 14
          if-no-files-found: warn

  launcher:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: launcher/app
    steps:
      - uses: actions/checkout@v6

      - name: Fetch AprilTag print assets
        working-directory: .
        run: git lfs pull --include="assets/markers/**" --exclude=""

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install launcher deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: |
          test_config="$(mktemp -d)"
          trap 'rm -rf "$test_config"' EXIT
          XDG_CONFIG_HOME="$test_config" pytest --junitxml="../../Review Data/unit/launcher/junit.xml"

      - name: Launcher browser policy tests
        run: node --test tests/static.test.mjs

      - name: Upload launcher test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-test-reports
          path: Review Data/unit/launcher/
          retention-days: 14
          if-no-files-found: warn

  client-core-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/core
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Upload Core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: Review Data/unit/core/
          retention-days: 14
          if-no-files-found: warn

  client-specs-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/specs/Tests
    steps:
      - uses: actions/checkout@v6
      - name: Fetch Core package and native shader graphs
        working-directory: .
        run: git lfs pull --include="clients/specs/Assets/Materials/Shaders/*.ss_graph,clients/specs/Packages/DimOSARClient.lspkg" --exclude=""
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - name: Native review tooling unit tests
        working-directory: .
        run: |
          set -o pipefail
          mkdir -p "Review Data/unit/specs-tooling"
          python3 -m unittest discover -s clients/specs/Tests/integration-tests -p 'test_*.py' 2>&1 | tee "Review Data/unit/specs-tooling/output.log"
      - name: Upload Specs test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specs-test-reports
          path: |
            Review Data/unit/specs/
            Review Data/unit/specs-tooling/
            Review Data/coverage/specs/
          retention-days: 14
          if-no-files-found: warn

  client-webxr-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/webxr
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser and video prerequisites
        run: ../../launcher/scripts/install-ci-system-deps.sh webxr
      - run: npx playwright install chromium
      - name: Verify integration contract and continuous encoding
        run: |
          mkdir -p "../../Review Data/unit/integration-tooling"
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination="../../Review Data/unit/integration-tooling/junit.xml" \
            ../../tools/integration-tests/integration.test.mjs ../../tools/integration-tests/visual-review.test.mjs
      - run: npm run test:integration
      - name: Upload browser visual reviews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webxr-visual-review
          path: |
            Review Data/webxr_golden-path.mp4
            Review Data/webxr/
            Review Data/unit/webxr/
            Review Data/unit/integration-tooling/
            Review Data/coverage/webxr/
          retention-days: 14
          if-no-files-found: warn
