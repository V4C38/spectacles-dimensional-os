[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dimos-ar"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["dimos", "websockets>=12.0"]

[project.optional-dependencies]
unitree = ["dimos[base,unitree]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dimos.ar*"]

[tool.pytest.ini_options]
testpaths = ["dimos/ar", "scripts"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: live WebSocket check against a running AR bridge",
]
addopts = "--import-mode=importlib -m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["E", "W", "F", "B", "UP", "N", "I", "C90", "A", "RUF", "TCH"]
ignore = [
    # DimOS upstream alignment (TC* break runtime type introspection; C901/N*/A*/RUF* deferred)
    "A001", "A002", "A003", "B008", "B017", "B019", "B024", "B026", "B904", "C901",
    # E402: tag_tracker defers cv2 import after _TRACE env read (7 hits if removed)
    "E402",
    "E501", "E721", "E722", "E741",
    # F811/F821: no hits today; kept for DimOS-style conditional/type-stub patterns
    "F811", "F821",
    "N801", "N802", "N803", "N806", "N817", "N999",
    "RUF003", "RUF009", "RUF012", "RUF034", "RUF043", "RUF059",
    # TC* breaks runtime type checking (DimOS metaclass introspects annotations at class creation)
    "TC001", "TC002", "TC003",
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["dimos", "dimos.ar"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["dimos.core.module.Module"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
disallow_untyped_defs = true
strict = true
files = ["dimos/ar"]
explicit_package_bases = true
exclude = ".*/test_."

# DimOS, cv2, dimos_lcm, unitree_webrtc_connect, websockets ship without
# py.typed markers or stubs; they are genuinely untyped dependencies.
[[tool.mypy.overrides]]
module = [
    "dimos.*",
    "dimos_lcm.*",
    "cv2.*",
    "scipy.*",
    "unitree_webrtc_connect.*",
    "websockets.*",
    "langchain_core.*",
]
ignore_missing_imports = true

# @rpc / @skill from DimOS are untyped, causing [untyped-decorator].
# This is a DimOS upstream issue; suppress it in files that use those decorators.
[[tool.mypy.overrides]]
module = [
    "dimos.ar.robot_profile.go2",
    "dimos.ar.robot_profile.g1",
    "dimos.ar.bridge.module",
    "dimos.ar.agent.skills",
]
disallow_untyped_decorators = false
